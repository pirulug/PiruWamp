[mysqld]
# Puerto
port=3306

# Carpeta base y de datos dinamicas
basedir=D:/Development/Python/PiruWamp/bin/mariadb/MariaDB-11.4.5/mariadb-11.4.5-winx64
datadir=D:/Development/Python/PiruWamp/data
tmpdir=D:/Development/Python/PiruWamp/tmp

# Optimizacion de Red y Conexiones
skip-name-resolve
bind-address=0.0.0.0
max_connections=150
table_open_cache=2000

# Motor InnoDB para 12 nucleos y 16GB RAM
innodb_buffer_pool_size=1G
innodb_log_file_size=128M
innodb_log_buffer_size=32M
innodb_flush_log_at_trx_commit=2
innodb_read_io_threads=8
innodb_write_io_threads=8
innodb_file_per_table=1

[client]
port=3306
